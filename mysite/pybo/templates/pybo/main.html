<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Toggle Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .toggle-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .image-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .image-box {
            width: 300px;
            height: 300px;
            padding: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="toggle-container">
        <label for="toggle">Select Model:</label>
        <select id="toggle">
            <option value="yolo">Yolo</option>
            <option value="resnet">ResNet</option>
        </select>
    </div>

    <div class="image-container">
        <div class="image-box">
            <img src="project/mysite/pybo/templates/pybo/image1.jpg" alt="Image 1">
        </div>
        <div class="image-box">
            <img src="project/mysite/pybo/templates/pybo/image1.jpg" alt="Image 2">
        </div>
    </div>
</body>
</html>
